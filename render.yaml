services:
  # 1. FastAPI Backend Service
  - type: web
    name: ai-rag-chatbot-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: RETRIEVAL_MODE
        value: hybrid
      - key: RETRIEVAL_K
        value: 5
      - key: LLM_TEMPERATURE
        value: 0.3
      - key: DUPLICATE_THRESHOLD
        value: 0.85
      - key: RRF_K
        value: 60
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # 2. React 19 + Vite Static Site Frontend
  - type: web
    name: ai-rag-chatbot-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-rag-chatbot-backend
          property: host
